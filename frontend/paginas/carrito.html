<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - InfoTek</title>
    <link rel="stylesheet" href="../estilos/index.css">
    <link rel="stylesheet" href="../estilos/carrito.css">
    <link rel="stylesheet" href="../estilos/responsive.css">
</head>
<body>

    <header class="header">
        <div class="header-contenido">

            <a href="index.html" class="header-logo">
    <img src="../recursos/imagenes/logo.png" alt="InfoTek">
    <h1>InfoTek</h1>
</a>

            <input type="text" class="buscador" placeholder="Buscar componentes...">
            <div class="buscador-sugerencias"></div>

            <div class="header-usuario">

                <!-- Botón carrito con contador -->
                <button class="btn-icon" id="btn-carrito-nav">
                    <img src="../recursos/imagenes/carrito.png" alt="carrito">
                    <span id="carrito-count" class="carrito-count">0</span>
                </button>

                <!-- Botón cuenta -->
                <button class="btn-icon" id="btn-cuenta">
                    <img src="../recursos/imagenes/usuario.png" alt="usuario">
                </button>

            </div>

        </div>
    </header>

    <main class="contenedor">
        <h1 class="titulo-seccion">Tu carrito</h1>

        <table class="tabla-carrito">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Precio</th>
                    <th>Cantidad</th>
                    <th>Total</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="lista-carrito"></tbody>
        </table>

        <div class="carrito-resumen">
            <p>Total: <span id="total-carrito">0 €</span></p>
            <button class="btn" id="btn-comprar">Ir a comprar</button>
        </div>
    </main>

    <footer class="footer">
        <!-- tu footer de siempre -->
    </footer>

    <script src="../scripts/carrito.js"></script>
</body>
</html>
