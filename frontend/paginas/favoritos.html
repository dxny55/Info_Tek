<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos - InfoTek</title>
    <link rel="stylesheet" href="../estilos/index.css">
    <link rel="stylesheet" href="../estilos/account.css"> 
    <link rel="stylesheet" href="../src/components/productCard/productCard.css">
    <style>
        .header-contenido {
            width: 100% !important;
            padding: 0 40px !important;
            max-width: none !important;
        }
    </style>
</head>

<body id="cuerpo-favoritos">
<header class="header">
    <div class="header-contenido">
        <div class="header-logo">
            <a href="index.html" class="logo-link">
                <img src="../recursos/imagenes/logo.png" alt="InfoTek">
                <span class="logo-texto">InfoTek</span>
            </a>
        </div>
        
        <input type="text" class="buscador" placeholder="Buscar en favoritos...">

        <div class="header-usuario">
            <button class="btn-icon"><img src="../recursos/imagenes/comparar.png" alt="Comparar"></button>
            
            <button class="btn-icon" id="btn-carrito-nav" onclick="window.location.href='../paginas/carrito.html'">
        <img src="../recursos/imagenes/carrito.png" alt="carrito">
        <span id="carrito-count" class="carrito-count">0</span>
    </button>

            <button class="btn-icon" id="btn-cuenta-header">
                <img src="../recursos/imagenes/usuario.png" alt="Usuario">
            </button>
        </div>
    </div>
</header>

<main class="contenedor-principal-cuenta">
    <div class="seccion-bienvenida" style="padding: 40px 0;">
        <h1 class="titulo-seccion">Mis favoritos</h1>
        <p id="contador-productos" class="contador"></p>
    </div>

    <div id="lista-favoritos" class="grid-productos" style="max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding: 20px;">
    </div>
</main>

<script src="../scripts/buscador.js"></script> <script type="module" src="../scripts/favoritos.js"></script>
<script type="module" src="../scripts/navegacionCarrito.js"></script>
</body>
</html>
