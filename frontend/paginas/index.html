<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfoTek - Tienda</title>

    <!-- CSS global -->
    <link rel="stylesheet" href="../estilos/index.css">

    <!-- CSS del componente ProductCard -->
    <link rel="stylesheet" href="../src/components/productCard/productCard.css">
    <script src="../../node_modules/chart.js/dist/chart.umd.js"></script>
    <!-- CSS del componente CompareModal -->
    <link rel="stylesheet" href="../src/components/compareModal/compareModal.css">
</head>

<body>
    <!-- ENCABEZADO -->
    <header class="header">
        <div class="header-contenido">
            <a href="index.html" class="header-logo">
    <img src="../recursos/imagenes/logo.png" alt="InfoTek">
    <h1>InfoTek</h1>
</a>

            <input type="text" class="buscador" placeholder="Buscar componentes...">

            <div class="header-usuario">
                <button class="btn-icon" id="btn-comparar-final">
                    <img src="../recursos/imagenes/comparar.png" alt="comparar">
                </button>
                <button class="btn-icon">
                    <img src="../recursos/imagenes/carrito.png" alt="carrito">
                </button>
                <button class="btn-icon" id="btn-cuenta">
                    <img src="../recursos/imagenes/usuario.png" alt="usuario">
                </button>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenedor">
        <!-- Layout principal: Filtros + Productos -->
        <div class="layout-tienda">
            
            <!-- FILTRO LATERAL (Sticky) -->
            <aside class="filtro-lateral">
                <div class="filtro-bloque">
                    <h3>Búsqueda de filtros</h3>
                </div>

                <div class="filtro-bloque">
                    <h3>Precio</h3>
                    <div class="filtro-rango-precio">
                        <input type="number" placeholder="11€" class="input-precio" id="precio-min">
                        <span>-</span>
                        <input type="number" placeholder="11964€" class="input-precio" id="precio-max">
                    </div>
                </div>

                <div class="filtro-bloque">
                <h3>Categorías</h3>
                <label><input type="checkbox" value="PC"> PC</label>
                <label><input type="checkbox" value="Electrodomesticos"> Electrodomésticos</label>
                <label><input type="checkbox" value="Consolas"> Consolas</label>

                <details>
                    <summary><strong>Componentes</strong></summary>
                    <label><input type="checkbox" value="CPU"> CPU</label>
                    <label><input type="checkbox" value="GPU"> GPU</label>
                    <label><input type="checkbox" value="RAM"> RAM</label>
                    <label><input type="checkbox" value="Placas Base"> Placas Base</label>
                    <label><input type="checkbox" value="Almacenamiento"> Almacenamiento</label>
                </details>
            </div>

            <div class="filtro-bloque">
                <h3>Marcas</h3>
                <label><input type="checkbox" value="AMD"> AMD</label>
                <label><input type="checkbox" value="Intel"> Intel</label>
                <label><input type="checkbox" value="NVIDIA"> NVIDIA</label>
                <label><input type="checkbox" value="Samsung"> Samsung</label>
                <label><input type="checkbox" value="Xiaomi"> Xiaomi</label>
                <label><input type="checkbox" value="Sony"> Sony</label>
                <label><input type="checkbox" value="Microsoft"> Microsoft</label>
                <label><input type="checkbox" value="Nintendo"> Nintendo</label>
            </div>

                <button id="btn-limpiar-filtros">Limpiar filtros</button>
            </aside>

            <!-- ZONA DE PRODUCTOS -->
            <div class="zona-productos">
                <div class="productos-header">
                    <h2 class="titulo-seccion">Todos los productos</h2>
                    <p class="contador" id="contador-productos">0 productos</p>
                </div>
                <section class="grid-productos" id="lista-productos"></section>
            </div>

        </div>
    </main>

    <footer class="footer">
        <div class="footer-contenido">
            <div class="footer-links">
                <a href="legal.html?tipo=terminos">Términos y Condiciones</a>
                <a href="legal.html?tipo=privacidad">Política de Privacidad</a>
                <a href="legal.html?tipo=cookies">Política de Cookies</a>
                <a href="legal.html?tipo=envio">Política de Envío</a>
                <a href="legal.html?tipo=aviso">Aviso Legal sobre Pagos</a>
            </div>

            <div class="footer-redes">
                <a href="#" class="red"><img src="../recursos/imagenes/facebook.png" alt="Facebook"></a>
                <a href="#" class="red"><img src="../recursos/imagenes/twitter.png" alt="Twitter"></a>
                <a href="#" class="red"><img src="../recursos/imagenes/instagram.png" alt="Instagram"></a>
                <a href="#" class="red"><img src="../recursos/imagenes/youtube.png" alt="YouTube"></a>
            </div>

            <p class="footer-copy">© 2026 InfoTek. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- SCRIPT PRINCIPAL COMO MÓDULO -->
    <script type="module" src="../scripts/cargarProductos.js"></script>
    <script src="../scripts/autenticacion.js"></script>
    <script src="../libs/apexcharts.js"></script>
</body>
</html>
