<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago - InfoTek</title>

    <link rel="stylesheet" href="../estilos/index.css">
    <link rel="stylesheet" href="../estilos/checkout.css">
    <link rel="stylesheet" href="../estilos/responsive.css">
</head>

<body>

<header class="header">
    <div class="header-contenido">
        <div class="header-logo">
            <img src="../recursos/imagenes/logo.png" alt="InfoTek">
            <h1>InfoTek</h1>
        </div>

        <div class="header-usuario">
            <button class="btn-icon" id="btn-carrito-nav">
                <img src="../recursos/imagenes/carrito.png" alt="carrito">
                <span id="carrito-count" class="carrito-count">0</span>
            </button>
        </div>
    </div>
</header>

<main class="checkout-layout">

    <!-- FORMULARIO -->
    <section class="checkout-box">

        <h2 class="box-title">📦 Dirección de envío</h2>

        <form id="form-envio">

            <div class="form-grid-2">
                <div class="form-grupo">
                    <label>Nombre*</label>
                    <input type="text" required>
                </div>

                <div class="form-grupo">
                    <label>Apellidos*</label>
                    <input type="text" required>
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-grupo">
                    <label>País*</label>
                    <select required>
                        <option value="España">España</option>
                    </select>
                </div>

                <div class="form-grupo">
                    <label>Móvil*</label>
                    <input type="tel" placeholder="+34 600 000 000" required>
                </div>
            </div>

            <div class="form-grupo">
                <label>Dirección y número*</label>
                <input type="text" placeholder="Ej. Calle de Cavanilles, 35" required>
            </div>

            <div class="form-grupo">
                <label>Datos adicionales</label>
                <input type="text" placeholder="Piso, puerta, barrio…">
            </div>

            <div class="form-grid-2">
                <div class="form-grupo">
                    <label>Código postal*</label>
                    <input type="text" required>
                </div>

                <div class="form-grupo">
                    <label>Población*</label>
                    <input type="text" required>
                </div>
            </div>

            <div class="form-grupo">
                <label>Provincia*</label>
                <input type="text" required>
            </div>

            <button class="btn-finalizar" type="submit">Guardar y continuar</button>
        </form>

    </section>

    <!-- RESUMEN -->
    <aside class="checkout-resumen">
        <h3>Resumen del pedido</h3>

        <div class="resumen-linea">
            <span>Subtotal artículos</span>
            <span id="subtotal">0€</span>
        </div>

        <div class="resumen-linea total">
            <span>Total (IVA incluido)</span>
            <span id="total">0€</span>
        </div>

        <button class="btn-pagar">Proceder al pago</button>
    </aside>

</main>

<script src="../scripts/checkout.js"></script>

</body>
</html>
